<!DOCTYPE html>
<html lang="uk">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Твоє Ім'я</title>
  <meta name="description" content="Private web-site">
  <meta name="theme-color" content="#000000">
  <meta name="color-scheme" content="dark">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400..700;1,400..700&family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --bg: #000000;
      --fg: #ffffff;
      --fg-muted: #8a8a90;
      --fg-faint: #5c5c62;
      --line: rgba(255, 255, 255, .10);
      --line-soft: rgba(255, 255, 255, .06);
      --surface: rgba(255, 255, 255, .03);
      --surface-hover: rgba(255, 255, 255, .07);
      --ease: cubic-bezier(.22, .61, .36, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    @media (prefers-reduced-motion: reduce) {
      html {
        scroll-behavior: auto;
      }

      * {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
      }
    }

    body {
      background: var(--bg);
      color: var(--fg);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      font-weight: 500;
      overflow-x: hidden;
    }

    ::selection {
      background: #fff;
      color: #000;
    }

    a {
      color: inherit;
    }

    /* ---------- entry overlay ---------- */
    #entry {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 22px;
      background: var(--bg);
      transition: opacity .9s var(--ease), visibility .9s var(--ease);
    }

    #entry.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    #entry-btn {
      width: 76px;
      height: 76px;
      border-radius: 50%;
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--fg);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: border-color .3s var(--ease), background-color .3s var(--ease), transform .3s var(--ease);
    }

    #entry-btn:hover,
    #entry-btn:focus-visible {
      border-color: rgba(255, 255, 255, .28);
      background: var(--surface-hover);
      transform: scale(1.05);
    }

    #entry-btn svg {
      width: 20px;
      height: 20px;
      fill: var(--fg);
      margin-left: 3px;
    }

    #entry p {
      font-size: 13px;
      color: var(--fg-muted);
      font-weight: 500;
    }

    /* ---------- hero ---------- */
    .hero {
      position: relative;
      height: 100vh;
      height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    #bg-video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: grayscale(.25) brightness(.42) contrast(1.05);
    }

    .no-video #bg-video {
      display: none;
    }

    .no-video .hero {
      background:
        radial-gradient(circle at 50% 15%, rgba(255, 255, 255, .05), transparent 45%),
        radial-gradient(circle at 20% 90%, rgba(255, 255, 255, .03), transparent 50%),
        #000;
    }

    .scrim {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(0, 0, 0, .25) 0%, rgba(0, 0, 0, .55) 60%, #000 100%);
      pointer-events: none;
    }

    .grain {
      position: absolute;
      inset: 0;
      opacity: .045;
      mix-blend-mode: overlay;
      pointer-events: none;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
    }

    .hero-content {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 0 24px;
      opacity: 0;
      transform: translateY(14px);
      transition: opacity 1s var(--ease) .1s, transform 1s var(--ease) .1s;
    }

    body.entered .hero-content {
      opacity: 1;
      transform: translateY(0);
    }

    .avatar-wrap {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      border: 1px solid var(--line);
      padding: 3px;
      margin-bottom: 26px;
    }

    .avatar {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      display: block;
      background: #0a0a0a;
    }

    .avatar-fallback {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0a0a0a;
      font-family: 'Instrument Sans', sans-serif;
      font-weight: 600;
      font-size: 16px;
      color: var(--fg);
    }

    .name {
      font-family: 'Instrument Sans', sans-serif;
      font-weight: 600;
      font-size: clamp(40px, 7vw, 72px);
      letter-spacing: -.03em;
      line-height: 1.02;
    }

    .name .light {
      font-weight: 400;
      color: var(--fg-muted);
    }

    .bio {
      margin-top: 20px;
      max-width: 420px;
      color: var(--fg-muted);
      font-size: 15px;
      line-height: 1.6;
    }

    /* ---------- scroll cue / level meter ---------- */
    .scroll-cue {
      position: absolute;
      left: 50%;
      bottom: 36px;
      z-index: 2;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      opacity: 0;
      transition: opacity 1s var(--ease) .6s, opacity .4s var(--ease);
    }

    body.entered .scroll-cue {
      opacity: 1;
    }

    .scroll-cue.faded {
      opacity: 0 !important;
      transition: opacity .4s var(--ease);
    }

    .scroll-arrow {
      width: 22px;
      height: 22px;
      color: var(--fg-muted);
      animation: bob 1.6s ease-in-out infinite;
    }

    @keyframes bob {

      0%,
      100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(7px);
      }
    }

    /* ---------- socials section ---------- */
    .socials {
      position: relative;
      background: #000;
      padding: 130px 24px 110px;
    }

    .socials-head {
      max-width: 560px;
      margin: 0 auto 70px;
      text-align: center;
    }

    .eyebrow {
      font-size: 12px;
      font-weight: 600;
      color: var(--fg-muted);
      display: block;
      margin-bottom: 16px;
    }

    .socials-head h2 {
      font-family: 'Instrument Sans', sans-serif;
      font-weight: 600;
      font-size: clamp(30px, 4.2vw, 42px);
      letter-spacing: -.02em;
      margin-bottom: 14px;
    }

    .socials-head p {
      color: var(--fg-muted);
      font-size: 14px;
      line-height: 1.6;
    }

    .divider {
      max-width: 560px;
      margin: 36px auto 0;
      border: none;
      border-top: 1px dashed var(--line);
    }

    .bento {
      max-width: 520px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-auto-rows: 120px;
      gap: 14px;
    }

    @media (max-width:460px) {
      .bento {
        grid-template-columns: 1fr;
      }
    }

    .tile {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 16px;
      text-decoration: none;
      color: var(--fg);
      transition: background-color .3s var(--ease), border-color .3s var(--ease), transform .3s var(--ease);
    }

    .tile:hover,
    .tile:focus-visible {
      background: var(--surface-hover);
      border-color: rgba(255, 255, 255, .22);
      transform: translateY(-3px);
    }

    .tile:focus-visible {
      outline: 1px solid rgba(255, 255, 255, .3);
      outline-offset: -1px;
    }

    /* small icon tiles */
    .tile-icon {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .tile-icon svg {
      width: 26px;
      height: 26px;
      fill: var(--fg);
    }

    .tile-icon span {
      font-size: 12px;
      color: var(--fg-muted);
      font-weight: 500;
    }

    .card-arrow {
      color: var(--fg-faint);
      font-size: 14px;
      transition: transform .25s var(--ease), color .25s var(--ease);
    }

    .tile:hover .card-arrow {
      transform: translate(2px, -2px);
      color: var(--fg);
    }

    footer {
      text-align: center;
      padding: 50px 24px 60px;
      font-size: 12px;
      color: var(--fg-faint);
      border-top: 1px solid var(--line-soft);
    }
  </style>
</head>

  <script>
    /* ---------- i18n ---------- */
    const SUPPORTED_LOCALES = ['uk', 'en'];
    const DEFAULT_LOCALE = 'en';

    function detectLocale() {
      const langs = (navigator.languages && navigator.languages.length)
        ? navigator.languages
        : [navigator.language || DEFAULT_LOCALE];
      for (const l of langs) {
        const short = l.split('-')[0].toLowerCase();
        if (SUPPORTED_LOCALES.includes(short)) return short;
      }
      return DEFAULT_LOCALE;
    }

    function getPath(obj, path) {
      return path.split('.').reduce((acc, k) => (acc && acc[k] !== undefined) ? acc[k] : undefined, obj);
    }

    function applyI18n(dict) {
      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        const value = getPath(dict, key);
        if (value === undefined) return;
        const attr = el.getAttribute('data-i18n-attr');
        if (attr) el.setAttribute(attr, value);
        else el.textContent = value;
      });
    }

    async function loadLocale(locale) {
      try {
        const res = await fetch(`locales/${locale}.json`);
        if (!res.ok) throw new Error('missing locale file');
        return { locale, dict: await res.json() };
      } catch (e) {
        if (locale !== DEFAULT_LOCALE) return loadLocale(DEFAULT_LOCALE);
        return null;
      }
    }

    (async function initI18n() {
      const result = await loadLocale(detectLocale());
      if (result) {
        applyI18n(result.dict);
        document.documentElement.lang = result.locale;
      }
    })();

    /* ---------- player ---------- */
    const video = document.getElementById('bg-video');
    const entry = document.getElementById('entry');
    const entryBtn = document.getElementById('entry-btn');
    const cue = document.getElementById('scroll-cue');
    const avatar = document.getElementById('avatar-img');

    document.getElementById('year').textContent = new Date().getFullYear();

    video.addEventListener('error', () => document.body.classList.add('no-video'), true);
    setTimeout(() => {
      if (video.readyState === 0) document.body.classList.add('no-video');
    }, 1500);

    avatar.addEventListener('error', () => {
      const wrap = avatar.parentElement;
      const initials = document.createElement('div');
      initials.className = 'avatar-fallback';
      initials.textContent = 'ТІ'; // заміни на свої ініціали
      wrap.replaceChild(initials, avatar);
    });

    const MAX_VOLUME = 0.25;

    function enter() {
      entry.classList.add('hidden');
      document.body.classList.add('entered');

      video.muted = false;
      video.volume = 0;
      video.currentTime = 0;
      video.play().catch(() => { });

      let v = 0;
      const fadeIn = setInterval(() => {
        v += 0.05;
        video.volume = Math.min(v, MAX_VOLUME);
        if (v >= MAX_VOLUME) clearInterval(fadeIn);
      }, 60);
      window.removeEventListener('keydown', onKeyEnter);
    }
    function onKeyEnter(e) { if (e.key === 'Enter' || e.key === ' ') enter(); }

    entryBtn.addEventListener('click', enter);
    window.addEventListener('keydown', onKeyEnter);

    // Гучність та індикатор прив'язані до прогресу скролу в межах першого екрана
    let ticking = false;
    function onScroll() {
      if (ticking) return;
      ticking = true;
      requestAnimationFrame(() => {
        const heroHeight = window.innerHeight;
        const progress = Math.min(Math.max(window.scrollY / heroHeight, 0), 1);

        video.volume = MAX_VOLUME * (1 - progress);

        cue.classList.toggle('faded', progress > 0.15);

        ticking = false;
      });
    }
    window.addEventListener('scroll', onScroll, { passive: true });
  </script>
